<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif">
<g transform="translate(10,20)"><rect width="200" height="240" rx="10" fill="#fff" stroke="#ddd"/><rect width="200" height="28" rx="10" fill="#24292f"/><text x="10" y="19" font-size="11" fill="#fff">Settings › Password and authentication</text>
<text x="12" y="60" font-size="12" font-weight="700" fill="#111">Two-factor authentication</text><rect x="12" y="76" width="176" height="30" rx="6" fill="#2da44e"/><text x="100" y="96" text-anchor="middle" font-size="12" fill="#fff">Enable two-factor authentication</text>
<text x="12" y="140" font-size="11" fill="#555">① 点这个绿色按钮</text></g>
<g transform="translate(240,20)"><rect width="200" height="240" rx="10" fill="#fff" stroke="#ddd"/><rect width="200" height="28" rx="10" fill="#24292f"/><text x="10" y="19" font-size="11" fill="#fff">Setup authenticator app</text>
<rect x="60" y="50" width="80" height="80" fill="#111"/><rect x="70" y="60" width="60" height="60" fill="#fff"/><rect x="76" y="66" width="14" height="14" fill="#111"/><rect x="110" y="66" width="14" height="14" fill="#111"/><rect x="76" y="100" width="14" height="14" fill="#111"/><rect x="96" y="86" width="8" height="8" fill="#111"/><rect x="110" y="100" width="14" height="14" fill="#111"/>
<text x="100" y="150" text-anchor="middle" font-size="11" fill="#555">② 用手机 app 的“扫码添加”扫这个二维码</text>
<rect x="30" y="170" width="140" height="26" rx="6" fill="#f6f8fa" stroke="#ddd"/><text x="100" y="188" text-anchor="middle" font-size="11" fill="#999">输入 app 上的 6 位数字</text>
<text x="100" y="220" text-anchor="middle" font-size="11" fill="#555">③ 把 app 显示的 6 位填进来</text></g>
<g transform="translate(470,20)"><rect width="200" height="240" rx="10" fill="#fff" stroke="#ddd"/><rect width="200" height="28" rx="10" fill="#24292f"/><text x="10" y="19" font-size="11" fill="#fff">Recovery codes</text>
<g font-size="11" fill="#111" font-family="Menlo,monospace"><text x="20" y="60">a1b2c-3d4e5</text><text x="110" y="60">f6g7h-8i9j0</text><text x="20" y="80">k1l2m-3n4o5</text><text x="110" y="80">p6q7r-8s9t0</text><text x="20" y="100">u1v2w-3x4y5</text><text x="110" y="100">z6a7b-8c9d0</text></g>
<rect x="20" y="120" width="160" height="26" rx="6" fill="#f6f8fa" stroke="#ddd"/><text x="100" y="138" text-anchor="middle" font-size="11" fill="#333">Download / Copy</text>
<text x="100" y="180" text-anchor="middle" font-size="11" fill="#555">④ 恢复码存进密码管理器</text><text x="100" y="198" text-anchor="middle" font-size="11" fill="#b00">手机丢了只能靠它，别只截图</text></g>
<g transform="translate(700,20)"><rect width="190" height="240" rx="10" fill="#fff" stroke="#ddd"/><rect width="190" height="28" rx="10" fill="#24292f"/><text x="10" y="19" font-size="11" fill="#fff">以后每次登录</text>
<rect x="20" y="60" width="150" height="26" rx="6" fill="#f6f8fa" stroke="#ddd"/><text x="95" y="78" text-anchor="middle" font-size="11" fill="#999">密码</text>
<rect x="20" y="100" width="150" height="26" rx="6" fill="#f6f8fa" stroke="#ddd"/><text x="95" y="118" text-anchor="middle" font-size="11" fill="#999">Authentication code</text>
<text x="95" y="160" text-anchor="middle" font-size="11" fill="#555">打开手机 app，抄 GitHub 那一行的 6 位</text><text x="95" y="178" text-anchor="middle" font-size="11" fill="#555">填进第二个框</text></g>
</svg>
