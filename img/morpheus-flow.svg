<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="12">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#94a3b8"/></marker></defs>
<g><rect x="10" y="40" width="160" height="150" rx="12" fill="#f4f4f6" stroke="#ddd"/><text x="90" y="65" text-anchor="middle" font-weight="700">① 进群后</text><text x="90" y="95" text-anchor="middle">引路人发 bot 名片</text><rect x="35" y="110" width="110" height="30" rx="8" fill="#2563eb"/><text x="90" y="130" text-anchor="middle" fill="#fff">打开 Morpheus</text><text x="90" y="170" text-anchor="middle" fill="#555">点名片进入私聊</text></g>
<line x1="175" y1="115" x2="215" y2="115" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<g><rect x="220" y="40" width="180" height="150" rx="12" fill="#f4f4f6" stroke="#ddd"/><text x="310" y="65" text-anchor="middle" font-weight="700">② 私聊发 /start</text><text x="310" y="95" text-anchor="middle">它给你一个链接和</text><text x="310" y="113" text-anchor="middle">一个 8 位代码</text><text x="310" y="145" text-anchor="middle" fill="#555">浏览器打开链接</text><text x="310" y="163" text-anchor="middle" fill="#555">用你的 GitHub 登录并输入代码</text></g>
<line x1="405" y1="115" x2="445" y2="115" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<g><rect x="450" y="40" width="170" height="150" rx="12" fill="#f4f4f6" stroke="#ddd"/><text x="535" y="65" text-anchor="middle" font-weight="700">③ 回来点按钮</text><rect x="475" y="85" width="120" height="30" rx="8" fill="#2563eb"/><text x="535" y="105" text-anchor="middle" fill="#fff">✅ 我已授权</text><text x="535" y="145" text-anchor="middle" fill="#555">绑定完成</text><text x="535" y="163" text-anchor="middle" fill="#555">入职单自动提交</text></g>
<line x1="625" y1="115" x2="665" y2="115" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<g><rect x="670" y="40" width="220" height="150" rx="12" fill="#f4f4f6" stroke="#ddd"/><text x="780" y="65" text-anchor="middle" font-weight="700">④ 等管理员点批准</text><text x="780" y="95" text-anchor="middle">你会收到私聊：</text><text x="780" y="113" text-anchor="middle">“邀请已发出，去接受”</text><text x="780" y="145" text-anchor="middle" fill="#555">去 GitHub 接受邀请后</text><text x="780" y="163" text-anchor="middle" fill="#555">再收到一条“入职完成”</text></g>
<text x="450" y="230" text-anchor="middle" fill="#777">全程只在 Telegram 和浏览器之间切换；卡在哪一步，私聊菜单“入门看板”能看到</text>
</svg>
